name: NAS-Info
version: "1.0.0"
slug: nas_info
description: >-
  Erkennt eingebundene Netzwerk-Speicher automatisch und legt pro Speicher ein
  Gerät mit Sensoren an (gesamt, belegt, frei, Auslastung, Status, Zuletzt geprüft)
  via MQTT.
url: "https://github.com/pottkopp/ha-apps"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
services:
  - mqtt:need
hassio_api: true
hassio_role: manager
homeassistant_api: true
options:
  interval: 300
  ignore_mounts: []
  mqtt_user: ""
  mqtt_password: ""
schema:
  interval: int(30,86400)
  mounts:
    - str?
